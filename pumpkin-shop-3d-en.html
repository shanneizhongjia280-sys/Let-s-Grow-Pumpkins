<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pumpkin Shop</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ee;--card:#fff;--ink:#222;--sub:#777;--acc:#e8590c;--ok:#2b8a3e;--chip:#ffe8cc;--line:#ddd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1f;--card:#26262c;--ink:#eee;--sub:#999;--acc:#ff922b;--ok:#69db7c;--chip:#4a3520;--line:#3a3a42}}
:root[data-theme="dark"]{--bg:#1b1b1f;--card:#26262c;--ink:#eee;--sub:#999;--acc:#ff922b;--ok:#69db7c;--chip:#4a3520;--line:#3a3a42}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:440px;padding:10px 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:14px;font-weight:700}
.pill{font-size:13px;background:var(--chip);padding:4px 10px;border-radius:99px;margin-left:4px}
.stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);touch-action:none}
canvas{display:block;width:100%;height:auto}
#panel{display:none;position:absolute;left:8px;right:8px;bottom:8px;max-height:82%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px;line-height:1.6;box-shadow:0 4px 18px rgba(0,0,0,.3)}
button{font:inherit;border:0;border-radius:12px;background:var(--chip);color:var(--ink);padding:10px 12px;touch-action:manipulation}
button:disabled{opacity:.35}
.wrap{display:flex;flex-wrap:wrap;gap:8px}
.go{background:var(--acc);color:#fff;font-weight:700;width:100%;margin-top:8px}
.lbl{font-size:12px;color:var(--sub);margin:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.st{font-size:12px;color:var(--sub)}
input{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-top:8px}
.slot{min-width:64px;min-height:44px;border:2px dashed var(--line);background:transparent}
.msg{color:var(--ok);font-weight:700}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.x{padding:4px 12px}
.bar{margin-top:6px;font-size:13px;color:var(--sub);min-height:20px}
</style>
</head>
<body>
<main>
<div class="top"><span>🎃 Pumpkin Shop</span><div><span class="pill" id="d"></span><span class="pill" id="ap"></span><span class="pill" id="m"></span></div></div>
<div class="stage"><canvas id="cv" width="360" height="520"></canvas><div id="fade" style="position:absolute;inset:0;background:#000;pointer-events:none;opacity:1"></div><div id="panel"></div></div>
<div class="bar" id="bar"></div>
<div class="bar" id="hint">Drag on the screen to move (joystick). A button appears near buildings. Crops are harvested automatically near the fields, and the stall sells automatically when you stand in front of it.</div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W=360,H=520,WH=640,GOAL=5000;
const $=id=>document.getElementById(id),R=n=>Math.floor(Math.random()*n),cv=$('cv');
let money=50,inv={p:0,s:0,pie:0,e:0,cake:0},L={plots:0,speed:0,cust:0,egg:0},sugar=false,cleared=false,mode=null,floats=[],fade=1,T=0;
let P={x:180,y:300,tx:180,ty:300,pend:null,mv:false};
const PR={p:30,pie:150,cake:400};
const OB=[{id:'pf',x:80,y:92},{id:'sf',x:280,y:92},{id:'shop',x:70,y:310},{id:'ov',x:290,y:310},{id:'sell',x:180,y:445},{id:'truck',x:180,y:92}];
const PN=()=>4+2*L.plots,GT=()=>7*Math.pow(.7,L.speed),SI=()=>6*Math.pow(.75,L.cust)*(1-Math.min(.35,fans*.01));
function fl(t,x,y){floats.push({t,x,y,life:1.6})}
const UP=[
 {n:'🌱 Expand fields (+2 plots)',c:()=>[100,250,450][L.plots],ok:()=>L.plots<3,go:()=>L.plots++},
 {n:'⚡ Faster growth',c:()=>[150,350][L.speed],ok:()=>L.speed<2,go:()=>L.speed++},
 {n:'📣 Build a signboard (more customers)',c:()=>[120,260][L.cust],ok:()=>L.cust<2,go:()=>L.cust++},
 {n:'🎋 Buy sugarcane field (unlocks pies! oven included)',c:()=>400,ok:()=>!sugar,go:()=>{sugar=true;sugarFX()}}];
function hd(t){return'<div class="ph"><b>'+t+'</b><button class="x" data-a="close">✕</button></div>'}
function shopView(){
  let h=hd('📣 Shop Upgrades')+'<div class="st">Money ¥'+money+'</div>',n=0;
  UP.forEach((u,i)=>{if(u.ok()){n++;h+='<div class="row"><span>'+u.n+'<div class="st">¥'+u.c()+'</div></span><button data-a="up" data-v="'+i+'" '+(money<u.c()?'disabled':'')+'>Buy</button></div>'}});
  if(!sugar)h+='<div class="st" style="margin-top:8px">💡 Buy the sugarcane field to bake Pumpkin Pie (2 pumpkins + 1 sugar) worth ¥'+PR.pie+' each!</div>';
  return h+(n?'':'All purchased!');
}
function clearView(){return'<div style="text-align:center"><div style="font-size:48px">👑</div><h3 style="margin:4px">Pumpkin Kingdom is born!</h3>¥'+GOAL+' reached!<br><div class="st">A bank 🏦 has been built to the south. Investing is unlocked!</div><button class="go" data-a="close">Continue</button></div>'}
function hud(){
  $('d').textContent='🎃¥'+PR.p+(mf>1.15?'▲':mf<.85?'▼':'');$('ap').textContent='🎃'+inv.p;$('m').textContent='💰¥'+money;
  $('bar').textContent='🎒 🎃Pumpkins ×'+inv.p+(sugar?'  🎋Sugar ×'+inv.s+'  🥧Pies ×'+inv.pie:'')+(farm?'  🥚×'+inv.e+'  🎂×'+inv.cake:'')+(cleared?'  📊¥'+invTotal():'')+'  👥'+fans+'  🎯¥'+GOAL;
}
function render(){
  hud();const p=$('panel');
  if(!mode){p.style.display='none';return}
  p.style.display='block';p.innerHTML=({shop:shopView,clear:clearView,city:cityView,oven:ovenView,farm:farmView,bank:bankView,result:()=>hd('🚚 Trip Result')+repHTML+'<button class="go" data-a="close">OK</button>'})[mode]();
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!b.dataset.a)return;
  const a=b.dataset.a,v=+b.dataset.v;
  if(a==='close'){mode=queue.length?queue.shift():null}
  else if(a==='up'){const u=UP[v];if(u.ok()&&money>=u.c()){money-=u.c();u.go()}}
  render();
});

/* ---- city shipping ---- */
let city=false,cargo={p:0,pie:0,cake:0},trip=null,trend=[1,1,1,1],hint=[1,1,1,1],repHTML='';
const DEST=[
 {n:'Nearby Town',e:'🏘️',pm:1.3,qm:1.2,c:[6,10],risk:.05,fee:30,d:'Safe and steady. Sells a bit higher'},
 {n:'Business District',e:'🌆',pm:1.6,qm:2.0,c:[10,16],risk:.25,fee:80,d:'Pies sell for 2×. Crowds can cause failures'},
 {n:'Fine-Dining District',e:'🍽️',pm:1.0,qm:3.5,c:[4,8],risk:.35,fee:150,d:'Pies 3.5×! Few customers, fails easily'},
 {n:'Halloween Festival',e:'🎪',pm:3.0,qm:2.5,c:[14,24],risk:.45,fee:120,d:'Pumpkins 3× and big crowds. Jackpot or bust'}];
const TR=[.7,1,1.4];
function refreshTrends(){DEST.forEach((d,i)=>{trend[i]=TR[R(3)];hint[i]=Math.random()<.7?trend[i]:TR[R(3)]})}
UP.push({n:'🚚 Ship to the city (build a depot)<div class="st">Sell higher depending on the destination. It can fail too</div>',c:()=>1000,ok:()=>sugar&&!city,go:()=>{city=true;cityFX();refreshTrends()}});
const tl=t=>t>1?'Booming':t<1?'Slump':'Normal';
function cityView(){
  let h=hd('🚚 Shipping Depot')+(trip?'<div class="msg">🚚 On a trip… back soon</div>':'<div class="st">Pick your cargo and destination (10s round trip, shipping fee paid upfront)</div>');
  h+='<div class="st">🎃 Price ¥'+PR.p+' ·👥 Regulars '+fans+' ·🔥 City fatigue: fail rate +'+Math.round(Math.min(heat*3,90))+'% (more trips = more risk; recovers over time)</div>';h+='<div class="row"><span>🎃 Pumpkins <b>'+cargo.p+'</b> / '+inv.p+'</span><span><button data-a="cg" data-v="p,-5">−5</button> <button data-a="cg" data-v="p,5">+5</button></span></div>';
  h+='<div class="row"><span>🥧 Pies <b>'+cargo.pie+'</b> / '+inv.pie+'</span><span><button data-a="cg" data-v="pie,-2">−2</button> <button data-a="cg" data-v="pie,2">+2</button></span></div>';
  if(farm)h+='<div class="row"><span>🎂 Cakes <b>'+cargo.cake+'</b> / '+inv.cake+'</span><span><button data-a="cg" data-v="cake,-1">−1</button> <button data-a="cg" data-v="cake,1">+1</button></span></div>';
  DEST.forEach((d,i)=>{const dis=trip||money<d.fee||cargo.p+cargo.pie+cargo.cake<1;
    h+='<div class="row"><div>'+d.e+' '+d.n+'<div class="st">'+d.d+'<br>Fail rate ~'+Math.round(rk(i)*100)+'% ·Rumor: '+tl(hint[i])+'? (unreliable)</div></div><button data-a="go" data-v="'+i+'" '+(dis?'disabled':'')+'>Go ¥'+d.fee+'</button></div>'});
  return h;
}
function settle(){
  const d=DEST[trip.d],tr=trend[trip.d],avg=(d.c[0]+d.c[1])/2,rk0=rk(trip.d);
  let pm=d.pm*tr,qm=d.qm*tr,cu=(d.c[0]+R(d.c[1]-d.c[0]+1)+Math.round(fans*.1))*(tr>1?1.3:tr<1?.7:1),kind='ok';
  if(Math.random()<rk0){if(Math.random()<.4)kind='crash';else{kind='bad';pm*=.4;qm*=.4;cu*=.5}}
  else if(Math.random()<.15){kind='great';pm*=1.3;qm*=1.3;cu*=1.5}
  cu=Math.round(cu);const c=trip.c.cake||0,q=trip.c.pie,p=trip.c.p;let sc=0,sq=0,sp=0,rev=0;
  if(kind!=='crash'){let n=cu;sc=Math.min(c,n);n-=sc;sq=Math.min(q,n);n-=sq;sp=Math.min(p,n);rev=Math.round(sc*PR.cake*qm+sq*PR.pie*qm+sp*PR.p*pm);inv.cake+=c-sc;inv.pie+=q-sq;inv.p+=p-sp;money+=rev}
  const df={great:5,ok:2,bad:-1,crash:-3}[kind];fans=Math.max(0,fans+df);
  const T0={great:'🎉 Great success!',ok:'👍 Sold without trouble',bad:'😢 Struggled in a slump…',crash:'💥 Truck accident!'}[kind],net=rev-trip.fee,ar=cu>avg?'↑':cu<avg?'↓':'→';
  repHTML='<div style="font-size:18px"><b>'+d.e+' '+d.n+':'+T0+'</b></div><div class="st">Economy: '+tl(tr)+' ·Fail rate '+Math.round(rk0*100)+'%</div>'+
   (kind==='crash'?'<div>🚫 Could not reach any customers; lost the cargo (🎃'+p+' 🥧'+q+' 🎂'+c+'). </div>':'<div>👥 Customers: '+cu+' (usual '+Math.round(avg)+' '+ar+')</div><div>Sold: 🎂×'+sc+' 🥧×'+sq+' 🎃×'+sp+'(🎃 ¥'+Math.round(PR.p*pm)+' each)</div><div>Brought back: 🎂×'+(c-sc)+' 🥧×'+(q-sq)+' 🎃×'+(p-sp)+'</div>')+
   '<div>Revenue ¥'+rev+' − Shipping ¥'+trip.fee+'</div><div class="msg" style="color:'+(net>=0?'var(--ok)':'#e03131')+'">Net '+(net>=0?'+':'−')+'¥'+Math.abs(net)+'</div>'+
   '<div style="margin-top:6px">⭐ Regulars '+(df>=0?'+':'')+df+' → total '+fans+' '+(df>0?'(Gained fans!)':'(Reputation dropped…)')+'</div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||!b.dataset.a)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='cg'){const[k,n]=v.split(',');cargo[k]=Math.max(0,Math.min(cargo[k]+ +n,k==='p'?Math.min(inv.p,30):k==='pie'?Math.min(inv.pie,15):Math.min(inv.cake,10)))}
  else if(a==='go'){
    const d=DEST[+v];if(trip||money<d.fee||cargo.p+cargo.pie+cargo.cake<1)return;
    money-=d.fee;heat+=d.h;inv.p-=cargo.p;inv.pie-=cargo.pie;inv.cake-=cargo.cake;trip={d:+v,c:{...cargo},fee:d.fee,t:10};cargo={p:0,pie:0,cake:0};mode=null;fl('🚚 Departed!',180,60);
  }else return;
  render();
});

/* ---- risk, fans, market ---- */
let fans=0,heat=0,mf=1,tf=1,mT=10;
DEST.forEach((d,i)=>d.h=[1,2,3,3][i]);
const rk=i=>Math.min(.9,DEST[i].risk+heat*.03);
const EV=[['🌾 Bumper harvest floods the market… pumpkin prices fall',.65],['🎃 Halloween is near! Pumpkins are hot',1.8],['🌪️ Typhoon shortage! Pumpkin prices rise',1.5],['📉 Rival undercutting… pumpkin prices fall',.75],['📺 Featured on TV! Pumpkin prices soar',1.6],['😌 The market is calm',1]];
function marketTick(dt){
  mT-=dt;
  if(mT<=0){mT=14+R(10);if(Math.random()<.6){const e=EV[R(EV.length)];tf=e[1];$('hint').textContent='📰 '+e[0]+' (~¥'+Math.round(30*e[1])+')'}else tf=Math.max(.6,Math.min(1.9,mf+(Math.random()-.5)*.6))}
  mf+=(tf-mf)*Math.min(1,dt*.4);PR.p=Math.max(10,Math.round(30*mf/5)*5);
}
/* ---- disasters, protection, farm, cake ---- */
let feedS=0,FC=10,autoFeed=true,farm=false,ovMode='pie',slowT=0,shake=0,dT=60,pending=null;
const prot={wind:0,frost:0,beast:0,dry:0};
const DIS=[{k:'wind',e:'🌪️',n:'Typhoon',tip:'Windbreak'},{k:'frost',e:'🥶',n:'Frost',tip:'Greenhouse'},{k:'beast',e:'🐗',n:'Boars',tip:'Boar Fence'},{k:'dry',e:'☀️',n:'Drought',tip:'Sprinklers'}];
UP.push({n:'🐔 Build chicken farm (eggs · feed is pumpkins · cake oven included!)<div class="st">3 pumpkins + 5 sugar + 2 eggs = Pumpkin Cake (¥'+PR.cake+')</div>',c:()=>5000,ok:()=>sugar&&!farm,go:()=>{farm=true;farmFX()}});
UP.push({get n(){return '🥚 Faster egg laying (Lv'+L.egg+'/3)<div class="st">Now 1 egg per '+ET().toFixed(1)+'s → '+(6*Math.pow(.7,L.egg+1)).toFixed(1)+'s</div>'},c:()=>[800,1500,2500][L.egg],ok:()=>farm&&L.egg<3,go:()=>{L.egg++}});
[['wind','🌪️ Windbreak','Typhoon',200],['frost','🏠 Greenhouse','Frost',250],['beast','🚧 Boar Fence','Boars',150],['dry','💧 Sprinklers','Drought',300]].forEach(([k,n,t,c])=>UP.push({get n(){return n+'('+t+' defense)<div class="st">Stock '+prot[k]+' / 3 (1 per disaster, used automatically)</div>'},c:()=>c,ok:()=>prot[k]<3,go:()=>{prot[k]++}}));
function strike(d){
  if(prot[d.k]>0){prot[d.k]--;$('hint').textContent='🛡️ '+d.tip+' protected the fields from '+d.n+'! (Stock left: '+prot[d.k]+(prot[d.k]?'':' · used up! Buy more')+')';fl('🛡️ Protected!',180,200);return}
  const cost=50+Math.min(800,Math.round(money*.1));money=Math.max(0,money-cost);shake=.25;
  if(d.k!=='dry'){plots.p.forEach(p=>p.t=0);if(d.k!=='beast')plots.s.forEach(p=>p.t=0)}
  if(d.k==='wind')inv.p=Math.floor(inv.p*.7);if(d.k==='beast')inv.p=Math.floor(inv.p*.5);if(d.k==='dry')slowT=25;
  $('hint').textContent='💥 '+d.e+d.n+' damage! '+(d.k==='dry'?'Crop growth slowed… ':'Fields ruined… ')+'Repair cost ¥'+cost+' ('+d.tip+' would have prevented it)';fl(d.e+' Damage!',180,200);
}
function disTick(dt){
  dT-=dt;if(!pending&&dT<=0){pending={d:DIS[R(4)],t:5};}
  if(pending){pending.t-=dt;if(pending.t<=0){strike(pending.d);pending=null;dT=45+R(30)}}warnTick();
  slowT=Math.max(0,slowT-dt);shake=Math.max(0,shake-dt*.6);
}
function ET(){return 6*Math.pow(.7,L.egg)}
function farmView(){return hd('🐔 Chicken Farm')+'<div class="st">Chickens eat pumpkins to lay eggs (1 pumpkin per 2 eggs). Currently 1 egg every '+ET().toFixed(1)+'s</div><div style="margin:6px 0">Feed: 🎃 <b>'+feedS.toFixed(1)+'</b> / '+FC+' (you have 🎃'+inv.p+')'+(feedS<=0?' <span style="color:#e03131">Out of feed!</span>':'')+'</div><div class="wrap"><button data-a="fd" data-v="1">+1</button><button data-a="fd" data-v="5">+5</button><button data-a="fd" data-v="max">Fill</button></div><div class="row"><span>Auto-feed when nearby<div class="st">Turn OFF to keep pumpkins for sale</div></span><button data-a="af">'+(autoFeed?'ON':'OFF')+'</button></div>'}
function ovenView(){return hd('🔥 Oven')+'<div class="st">Stand nearby to bake automatically. Choose what to bake</div><div class="row"><span>🥧 Pie<div class="st">2 pumpkins + 1 sugar (4s)</div></span><button data-a="om" data-v="pie">'+(ovMode==='pie'?'✔ Selected':'Select')+'</button></div><div class="row"><span>🎂 Pumpkin Cake<div class="st">3 pumpkins + 5 sugar + 2 eggs (6s)</div></span><button data-a="om" data-v="cake" '+(farm?'':'disabled')+'>'+(!farm?'Needs chicken farm':ovMode==='cake'?'✔ Selected':'Select')+'</button></div>'}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==='om'){ovMode=v;render()}
  else if(a==='fd'){const room=Math.floor(FC-feedS),n=Math.max(0,Math.min(v==='max'?room:+v,room,inv.p));inv.p-=n;feedS+=n;if(n)fl('Feed 🎃×'+n,60,530);render()}
  else if(a==='af'){autoFeed=!autoFeed;render()}});
/* ---- investing ---- */
const PRODS=[{n:'Stable Fund',e:'🏦',d:'Moves gently',vol:.012,dr:.0004},{n:'Growth Stock',e:'📈',d:'Moderately volatile',vol:.035,dr:.0004},{n:'Pumpkin Coin',e:'🪙',d:'Wild swings! High risk',vol:.08,dr:0}];
const pr=[100,100,100],hist=PRODS.map(()=>[100]),pos=PRODS.map(()=>({c:0,u:0})),ov2={cook:0,t:0,ready:0};let invAmt=1000,invAcc=0;
const invTotal=()=>Math.round(pos.reduce((a,p,i)=>a+p.u*pr[i],0));
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
function invTick(dt){
  invAcc+=dt;if(invAcc<.5)return;invAcc=0;
  PRODS.forEach((p,i)=>{let r=p.dr+p.vol*gauss();if(i===2&&Math.random()<.02)r+=(Math.random()<.5?-1:1)*.25;pr[i]=Math.max(20,Math.min(500,pr[i]*(1+r)));const h=hist[i];h.push(pr[i]);if(h.length>40)h.shift()});
  if(mode==='bank')bankLive();
}
function spark(i){const h=hist[i],mn=Math.min(...h),mx=Math.max(...h),rg=Math.max(1,mx-mn);return h.map((v,k)=>(k/Math.max(1,h.length-1)*100).toFixed(1)+','+(29-(v-mn)/rg*28).toFixed(1)).join(' ')}
function holdTxt(i){const p=pos[i];if(p.u<=0)return'Not held';const v=Math.round(p.u*pr[i]),d=v-p.c;return'Principal ¥'+p.c+' → Now ¥'+v+'('+(d>=0?'+':'−')+'¥'+Math.abs(d)+' / '+(d>=0?'+':'')+(d/p.c*100).toFixed(1)+'%)'}
function bankLive(){PRODS.forEach((p,i)=>{const a=document.getElementById('bp'+i),b=document.getElementById('bs'+i),c=document.getElementById('bh'+i);if(a)a.textContent='¥'+pr[i].toFixed(1);if(b)b.setAttribute('points',spark(i));if(c)c.textContent=holdTxt(i)})}
function bankView(){

    if(near(ob)){
      if(o.ready>0){inv[kd]+=o.ready;fl('+'+(kd==='cake'?'🎂':'🥧')+'×'+o.ready,ob.x,ob.y-30);o.ready=0}
      if(o.cook===0&&o.ready===0){
        const k=kd==='cake'?Math.min(3,Math.floor(inv.p/3),Math.floor(inv.s/5),Math.floor(inv.e/2)):Math.min(3,Math.floor(inv.p/2),inv.s);
        if(k>0){if(kd==='cake'){inv.p-=3*k;inv.s-=5*k;inv.e-=2*k}else{inv.p-=2*k;inv.s-=k}o.cook=k;o.t=kd==='cake'?6:4;fl('Baking 🔥',ob.x,ob.y-30)}
      }
    }
    const key=o.ready?(kd==='cake'?'🎂':'🥧')+'×'+o.ready+' ready!':o.cook?'Baking…':(kd==='cake'?'Cake Oven':'Pie Oven');
    if(key!==o.key){o.key=key;label(ob.id,kd==='cake'?'🎂':'🥧',key,2.9)}
  });
  if(trip){trip.t-=dt;if(trip.t<=0){settle();trip=null;refreshTrends();qOpen('result')}}
  G.truck.userData.tb.visible=!trip;
  const tk=trip?'Away '+Math.ceil(trip.t)+'s':'Depot';if(tk!==trKey){trKey=tk;label('truck','🚚',tk,2.4)}
  /* floats, player, camera */
  floats.forEach(f=>{f.life-=dt;if(!f.s){f.s=spr(f.t||' ',26,'o',.6);scene.add(f.s)}f.s.position.set(X3(f.x),2.3+(1.6-f.life)*.8,Z3(f.y));f.s.material.opacity=Math.min(1,f.life)});
  floats=floats.filter(f=>{if(f.life>0)return true;scene.remove(f.s);return false});
  pg.position.set(X3(P.x),(P.mv||joyOn)?Math.abs(Math.sin(T*12))*.12:0,Z3(P.y));pg.rotation.y=P.rot||0;
  ring.visible=P.mv&&!P.pend;ring.position.x=X3(P.tx);ring.position.z=Z3(P.ty);
  const cx=X3(P.x)*.35,cz=Math.min(Z3(P.y),10);camT.set(cx,10.5,cz+8.5);
  if(!camInit){cam.position.copy(camT);camInit=true}else cam.position.lerp(camT,.08);
  cam.position.x+=Math.sin(T*70)*shake;cam.lookAt(cam.position.x,0,cam.position.z-8.5);
  fade=Math.max(0,fade-dt*1.2);$('fade').style.opacity=fade;
  hT-=dt;if(hT<=0){hud();hT=.2}
  if(!cleared&&money>=GOAL){cleared=true;G.bank.visible=true;qOpen('clear')}
  ren.render(scene,cam);requestAnimationFrame(loop);
}
fl('Grow and sell pumpkins!',180,260);render();requestAnimationFrame(loop);

<script>

(function(){

  var MEL=[
    64,67,64,60,62,64,67,0,   69,67,64,0,67,64,60,0,
    65,69,72,69,65,69,67,0,   67,71,74,71,67,0,62,0,
